# Blueprint Render — alimentation du catalogue MTG-DB en production.
#
# Deux Cron Jobs construisent l'image du Dockerfile de ce dépôt et l'exécutent
# contre la base Render `relictrade`. Plus aucun poste n'est sur le chemin de la
# production : c'est tout l'objet de ce fichier.
#
# ── Mise en service ─────────────────────────────────────────────────────────
#
#   Dashboard Render → New → Blueprint → choisir le dépôt Middel7/MTG-DB.
#   Render lit ce fichier et propose les deux services. Il demandera la valeur
#   de DATABASE_URL (marquée `sync: false` : elle n'est pas dans le dépôt).
#
#   Coller l'URL INTERNE de la base (dashboard de la base → « Internal Database
#   URL »), pas l'externe : elle ne sort pas du réseau Render, ne consomme pas
#   de bande passante sortante, et évite la coupure SSL qui a fait échouer le
#   run du 17/09 depuis le poste.
#
# ── Région ──────────────────────────────────────────────────────────────────
#
#   `frankfurt`, comme la base. Ce n'est pas un détail de confort : l'URL
#   interne n'est joignable que depuis la MÊME région. Un job créé dans la
#   région par défaut (Oregon) ne verrait tout simplement pas la base.
#
# ── Ce que ces jobs ne font pas ─────────────────────────────────────────────
#
#   Aucune migration Alembic. La base `relictrade` est partagée avec
#   RELIC-Trade et porte deux chaînes de migration distinctes ; les migrations
#   restent une opération manuelle et délibérée (voir docs/migrations.md).

services:
  # ── Veille et import : Scryfall + Cardmarket + Game Changers ──────────────
  #
  # ⚠️ Le nom dit « quotidien » mais le job passe TOUTES LES HEURES depuis le
  # 20/09. Renommer un service dans un blueprint en crée un nouveau — on perdrait
  # l'historique des runs et il faudrait ressaisir DATABASE_URL. Le nom reste
  # donc, la planification ci-dessous fait foi.
  #
  # Pourquoi toutes les heures : Scryfall publie deux fois par jour (~09:18 et
  # ~21:17 UTC) et Cardmarket une fois (~00:42 UTC). Un passage quotidien
  # laissait le catalogue jusqu'à 24 h en retard sur la source, et ne voyait
  # qu'une publication Scryfall sur deux.
  #
  # Ce que coûte un passage à vide : le script EST sa propre sonde. Scryfall
  # compare `import_runs.source_file` et sort, Cardmarket compare l'ETag par
  # une requête HEAD et sort, Game Changers ne touche plus que 53 lignes. Un
  # passage sans nouveauté prend ~40 s ; seuls les deux ou trois passages
  # quotidiens qui trouvent du neuf font le vrai travail (14 min mesurées).
  #
  # Coût estimé : ~48 min d'exécution par jour, soit 24 h/mois — sous le minimum
  # de facturation de 1 $/mois par service.
  #
  # Render coupe un run à 12 h et retarde le suivant tant que celui-ci tourne :
  # deux passages horaires ne peuvent pas se chevaucher. Le verrou advisory
  # couvre le cas d'un run lancé en parallèle depuis ailleurs.
  - name: mtgdb-catalogue-quotidien
    type: cron
    runtime: docker
    region: frankfurt # IMPÉRATIF : même région que la base, sinon URL interne injoignable
    plan: standard # 1 vCPU / 2 Go — pic mesuré du pipeline : 350 Mo
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true # un push sur main reconstruit l'image du prochain run
    # À chaque heure pile, UTC. La nuit n'a plus d'importance : un passage à
    # vide ne sollicite pas la base, et un import réel dure 14 min.
    schedule: "0 * * * *"
    dockerCommand: python scripts/update_all.py --skip tags
    envVars:
      - key: DATABASE_URL
        sync: false # renseignée à la création : URL INTERNE de la base Render
      # Obligatoire en production : RELIC-Trade lit ses prix dans
      # cardmarket_price_guide_entries, jamais dans scryfall_card_prices
      # (apps/api/AGENTS.md l'interdit explicitement). Écrire cette table
      # coûtait ~344 000 lignes par run pour personne.
      #
      # ⚠️ Le flag ARRÊTE l'écriture, il ne supprime rien : la table contient
      # 4 061 065 lignes du 07/06 au 30/08/2026, soit 738 Mo d'historique non
      # reconstituable. Ne jamais la purger sans décision explicite.
      - key: SKIP_SCRYFALL_PRICES
        value: "1"
      - key: TZ
        value: Europe/Paris # n'affecte que l'affichage des horodatages du journal

  # ── Run hebdomadaire : tags Tagger ────────────────────────────────────────
  #
  # Séparé du quotidien parce qu'il dure ~40 min en local et qu'il retente à
  # chaque passage les cartes que Tagger ne connaît pas : le lancer tous les
  # jours coûterait cher pour presque rien.
  #
  # 05:00 UTC le dimanche : le run quotidien démarré à 01:00 est terminé depuis
  # longtemps. Render ne coordonne PAS deux services entre eux — c'est le verrou
  # pg_advisory_lock, côté base, qui reste le seul filet si les deux se
  # croisaient (le second sortirait alors en code 2 sans rien écrire).
  - name: mtgdb-tags-hebdomadaire
    type: cron
    runtime: docker
    region: frankfurt
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    schedule: "0 5 * * 0"
    dockerCommand: python scripts/update_all.py --only tags
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SKIP_SCRYFALL_PRICES
        value: "1"
      - key: TZ
        value: Europe/Paris

  # ── Veille de fraîcheur : alerte si le catalogue décroche ─────────────────
  #
  # Ce job ne met rien à jour. Il lit la vue `mtgdb_fraicheur_sources` et sort
  # en code 1 si quelque chose cloche — Render envoie alors son e-mail d'échec
  # de cron job. C'est ce qui permet d'être alerté sans stocker ni maintenir
  # aucun identifiant SMTP.
  #
  # Trois motifs d'alerte, chacun correspondant à une panne que rien d'autre ne
  # montre :
  #
  #   retard   une version publiée attend depuis plus de 6 h — le pipeline
  #            tourne mais l'import échoue à l'absorber ;
  #   veille   une source n'a plus été interrogée depuis plus de 3 h — c'est le
  #            job horaire lui-même qui ne passe plus ;
  #   tags     aucun import de tags réussi depuis plus de 9 jours, soit un run
  #            hebdomadaire manqué.
  #
  # 08:00 UTC : le bulk Scryfall de ~21:17 la veille et le price guide de
  # ~00:42 ont eu largement le temps d'être absorbés par les passages horaires.
  # Alerter plus tôt produirait des faux positifs sur un simple décalage.
  - name: mtgdb-veille-fraicheur
    type: cron
    runtime: docker
    region: frankfurt
    plan: starter # lecture d'une vue : quelques secondes, quelques Mo
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    schedule: "0 8 * * *"
    dockerCommand: python scripts/fraicheur.py --check
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TZ
        value: Europe/Paris
