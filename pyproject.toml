[project]
name = "mtgdb"
version = "0.1.0"
description = "Base de données MTG partagée — modèles SQLAlchemy, migrations Alembic, scripts d'import Scryfall"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    # Scripts d'import
    "httpx>=0.27",
    "ijson>=3.3",
    "tqdm>=4.66",
]

# Pas de [project.scripts] : les imports ne sont pas des commandes installables.
#
# Ce paquet expose une BIBLIOTHÈQUE (modèles SQLAlchemy + engine), consommée par
# ManaMind_AI et RELIC via `from mtgdb.db...`. Les scripts d'import, eux, vivent dans
# scripts/ à la racine — hors du wheel — et s'appuient sur `sys.path.insert(ROOT/"src")`
# pour tourner depuis le dépôt cloné. Ils s'invoquent par chemin :
#
#     python scripts/update_all.py        (ou .\update.ps1, ou l'image Docker)
#
# Des entry points mtgdb-* ont existé ici, mais pointaient vers des modules inexistants
# (`mtgdb.scripts.*`) ou non packagés (`scripts.*`) : aucun n'a jamais fonctionné après
# installation. Les rétablir supposerait de déplacer scripts/ dans src/mtgdb/, ce que rien
# ne justifie tant que le déclenchement passe par un ordonnanceur.

# Dépendances de développement : installées par `uv sync`, exclues de l'image
# par le `uv sync --frozen --no-dev` du Dockerfile.
#
# Ruff est épinglé sur une version mineure. Le dépôt ne fixait aucun `select` et
# n'installait pas l'outil : le résultat du lint dépendait donc entièrement de la
# version que chacun avait sous la main — un jeu de règles par défaut qui s'élargit
# d'une version à l'autre fait échouer la CI sans qu'une seule ligne ait changé.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgdb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

# Jeu de règles EXPLICITE, et non le défaut de l'outil : celui-ci s'élargit au fil
# des versions de Ruff, et une CI qui passe aujourd'hui échouerait demain sur du
# code inchangé.
#
#   E, F  erreurs réelles (pycodestyle, pyflakes) — le socle
#   I     ordre des imports, pour que les diffs ne se disputent pas cette ligne
#   B     pièges courants (mutable default, closure sur variable de boucle…)
#
# Volontairement ABSENT : `UP`. La modernisation des annotations
# (`Optional[str]` → `str | None`) toucherait ~140 lignes réparties dans tout le
# dépôt pour un gain nul en fiabilité, et noierait les vrais changements.
[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Les scripts DOIVENT insérer `src/` dans sys.path avant d'importer `mtgdb` :
# ils vivent hors du wheel et s'exécutent par chemin (voir plus haut). E402 y est
# la conséquence d'un choix assumé, pas un oubli.
"scripts/*.py" = ["E402"]
# Les migrations portent de longues docstrings explicatives et du SQL littéral.
"alembic/versions/*.py" = ["E501"]
"alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les modules vivent dans src/ et le paquet n'est pas installé en editable dans
# tous les environnements : ce chemin évite un `pip install -e .` préalable.
pythonpath = ["src"]
# Les tests qui ont besoin d'une vraie base PostgreSQL sont marqués `integration`
# et se sautent d'eux-mêmes si DATABASE_URL est absent.
markers = [
    "integration: nécessite une base PostgreSQL accessible via DATABASE_URL",
]
